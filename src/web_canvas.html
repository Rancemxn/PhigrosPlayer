    CKContext.prototype.drawRotateImage = function(im, x, y, width, height, deg, alpha) { // draw at the position center
        window.ctx.save();
        window.ctx.globalAlpha *= alpha;
        if (!!deg) {
            window.ctx.translate(x, y);
            window.ctx.rotate(deg * Math.PI / 180);
            window.ctx.drawImage(im, -width / 2, -height / 2, width, height);
        } else {
            window.ctx.drawImage(im, x - width / 2, y - height / 2, width, height);
        }
        window.ctx.restore();
    }

    CKContext.prototype.drawAnchorESRotateImage = function(im, x, y, width, height, deg, alpha) {
        window.ctx.save();
        window.ctx.globalAlpha *= alpha;
        if (!!deg) {
            window.ctx.translate(x, y);
            window.ctx.rotate(deg * Math.PI / 180);
            window.ctx.drawImage(im, -width / 2, -height, width, height);
        } else {
            window.ctx.drawImage(im, x - width / 2, y - height, width, height);
        }
        window.ctx.restore();
    }

    CKContext.prototype.drawScaleImage = function(im, x, y, width, height, xs, ys) {
        x += width / 2; y += height / 2;
        window.ctx.save();
        window.ctx.translate(x, y);
        window.ctx.scale(xs, ys);
        window.ctx.drawImage(im, -width / 2, -height / 2, width, height);
        window.ctx.restore();
    }

    CKContext.prototype.drawRPEMultipleRotateText = function(text, x, y, deg, fontsize, color, xs, ys) {
        window.ctx.save();
        window.ctx.translate(x, y);
        window.ctx.rotate(deg * Math.PI / 180);
        window.ctx.scale(xs, ys);
        window.ctx.fillStyle = color;
        window.ctx.textAlign = "center";
        window.ctx.textBaseline = "middle";
        window.ctx.font = `${fontsize}px PhigrosFont`;

        if (text.includes("\n") && RPEVersion >= 150) {
            let texts = text.split("\n");
            let x = 0.0; let y = 0.0;
            for (let currtext of texts) {
                if (currtext) window.ctx.fillText(currtext, x, y);
                let measure = window.ctx.measureText(currtext);
                y += (measure.actualBoundingBoxDescent + measure.actualBoundingBoxAscent) * 1.25;
            }
        }
        else {
            window.ctx.fillText(text, 0, 0);
        }

        window.ctx.restore();
    }

    CKContext.prototype.drawRotateText = function(text, x, y, deg, fontsize, color, xscale, yscale) {
        window.ctx.save();
        window.ctx.translate(x, y);
        window.ctx.rotate(deg * Math.PI / 180);
        window.ctx.scale(xscale, yscale);
        window.ctx.fillStyle = color;
        window.ctx.textAlign = "center";
        window.ctx.textBaseline = "middle";
        window.ctx.font = `${fontsize}px PhigrosFont`;
        window.ctx.fillText(text, 0, 0);
        window.ctx.restore();
    }

    CKContext.prototype.drawAlphaImage = function(im, x, y, width, height, alpha) {
        window.ctx.save()
        window.ctx.globalAlpha *= alpha;
        window.ctx.drawImage(im, x, y, width, height);
        window.ctx.restore();
    }

    CKContext.prototype.drawAlphaCenterImage = function(im, x, y, width, height, alpha) {
        window.ctx.save()
        window.ctx.globalAlpha *= alpha;
        window.ctx.drawImage(im, x - width / 2, y - height / 2, width, height);
        window.ctx.restore();
    }

    CKContext.prototype.drawTextEx = function(text, x, y, font, color, align, baseline) {
        window.ctx.save();
        window.ctx.fillStyle = color;
        window.ctx.textAlign = align;
        window.ctx.textBaseline = baseline;
        window.ctx.font = font;
        window.ctx.fillText(text, x, y);
        window.ctx.restore();
    }

    CKContext.prototype.fillRectEx = function(x, y, w, h, color) {
        window.ctx.save();
        window.ctx.fillStyle = color;
        window.ctx.fillRect(x, y, w, h);
        window.ctx.restore();
    }

    CKContext.prototype.fillRectExConvert2LeftCenter = function(x, y, w, h, color) {
        y += h / 2;
        window.ctx.save();
        window.ctx.fillStyle = color;
        window.ctx.beginPath();
        window.ctx.moveTo(x, y - h / 2);
        window.ctx.lineTo(x + w, y - h / 2);
        window.ctx.lineTo(x + w, y + h / 2);
        window.ctx.lineTo(x, y + h / 2);
        window.ctx.closePath();
        window.ctx.fill();
        window.ctx.restore();
    }

    CKContext.prototype.fillRectExByRect = function(x0, y0, x1, y1, color) {
        return window.ctx.fillRectEx(x0, y0, x1 - x0, y1 - y0, color);
    }

    CKContext.prototype.strokeRectEx = function(x, y, w, h, color, width) {
        window.ctx.save();
        window.ctx.strokeStyle = color;
        window.ctx.lineWidth = width;
        window.ctx.strokeRect(x, y, w, h);
        window.ctx.restore();
    }

    CKContext.prototype.addRoundRectData = function(x, y, w, h, r) {
        if (window.ctx._roundDatas == undefined) window.ctx._roundDatas = [];
        window.ctx._roundDatas.push({ x: x, y: y, w: w, h: h, r: r });
    }

    CKContext.prototype.drawRoundDatas = function(color) {
        if (window.ctx._roundDatas) {
            window.ctx.roundRectsEx(color, window.ctx._roundDatas);
            window.ctx._roundDatas = undefined;
        }
    }

    CKContext.prototype.roundRectsEx = function(color, datas) {
        window.ctx.save();
        window.ctx.fillStyle = color;
        window.ctx.beginPath();
        for (let i of datas) {
            window.ctx.roundRect(i.x, i.y, i.w, i.h, i.r);
        }
        window.ctx.fill();
        window.ctx.restore();
    }

    CKContext.prototype.drawLineEx = function(x1, y1, x2, y2, width, color) {
        window.ctx.save();
        window.ctx.strokeStyle = color;
        window.ctx.lineWidth = width;
        window.ctx.beginPath();
        window.ctx.moveTo(x1, y1);
        window.ctx.lineTo(x2, y2);
        window.ctx.stroke();
        window.ctx.restore();
    }

    CKContext.prototype._diagonalRectangle = function(x0, y0, x1, y1, power) {
        window.ctx.moveTo(x0 + (x1 - x0) * power, y0);
        window.ctx.lineTo(x1, y0);
        window.ctx.lineTo(x1 - (x1 - x0) * power, y1);
        window.ctx.lineTo(x0, y1);
        window.ctx.lineTo(x0 + (x1 - x0) * power, y0);
    }

    CKContext.prototype.clipDiagonalRectangle = function(x0, y0, x1, y1, power) {
        window.ctx.beginPath();
        window.ctx._diagonalRectangle(x0, y0, x1, y1, power);
        window.ctx.clip();
    }

    CKContext.prototype.clipRect = function(x0, y0, x1, y1) {
        window.ctx.beginPath();
        window.ctx.rect(x0, y0, x1 - x0, y1 - y0);
        window.ctx.clip();
    }
    
    CKContext.prototype.drawClipXText = function(text, x, y, align, baseline, color, font, clipx0, clipx1) {
        window.ctx.save();
        window.ctx.clipRect(clipx0, 0, clipx1, window.ctx.canvas.height);
        window.ctx.fillStyle = color;
        window.ctx.textAlign = align;
        window.ctx.textBaseline = baseline;
        window.ctx.font = font;
        window.ctx.fillText(text, x, y);
        window.ctx.restore();
    }

    CKContext.prototype.drawDiagonalRectangle = function(x0, y0, x1, y1, power, color) {
        window.ctx.save();
        window.ctx.fillStyle = color;
        window.ctx.beginPath();
        window.ctx._diagonalRectangle(x0, y0, x1, y1, power);
        window.ctx.fill();
        window.ctx.restore();
    }

    CKContext.prototype.drawDiagonalDialogRectangleText = function(x0, y0, x1, y1, power, text1, text2, color, font) {
        window.ctx.save();
        window.ctx.fillStyle = color;
        window.ctx.font = font;
        window.ctx.textBaseline = "middle";
        window.ctx.textAlign = "left";
        window.ctx.fillText(text1, x0 + (x1 - x0) * power * 3.0, y0 + (y1 - y0) * 0.5);
        window.ctx.textAlign = "right";
        window.ctx.fillText(text2, x1 - (x1 - x0) * power * 2.0, y0 + (y1 - y0) * 0.5);
        window.ctx.restore();
    }

    CKContext.prototype.drawDiagonalRectangleClipImage = function(x0, y0, x1, y1, im, imx, imy, imw, imh, power, alpha) {
        if (alpha == 0.0) return;
        window.ctx.save();
        window.ctx.globalAlpha *= alpha;
        window.ctx.beginPath();
        window.ctx._diagonalRectangle(x0, y0, x1, y1, power);
        window.ctx.clip();
        window.ctx.drawImage(im, x0 + imx, y0 + imy, imw, imh);
        window.ctx.restore();
    }

    CKContext.prototype.drawDiagonalRectangleClipImageOnlyHeight = function(x0, y0, x1, y1, im, imh, power, alpha) {
        let imw = imh * im.width / im.height;
        if (imw < x1 - x0) {
            imw = x1 - x0;
            imh = imw * im.height / im.width;
        }
        let imx = (x1 - x0) / 2 - imw / 2;
        let imy = (y1 - y0) / 2 - imh / 2;
        return window.ctx.drawDiagonalRectangleClipImage(x0, y0, x1, y1, im, imx, imy, imw, imh, power, alpha);
    }

    CKContext.prototype.drawTriangleFrame = function(x0, y0, x1, y1, x2, y2, color, width) {

        window.ctx.strokeStyle = color;
        window.ctx.lineWidth = width;
        window.ctx.beginPath();

    CKContext.prototype.drawRectMultilineText = function(x0, y0, x1, y1, text, color, font, fontsize, lineOffsetScale) {
        window.ctx.save();

        window.ctx.font = font;
        window.ctx.fillStyle = color;
        window.ctx.textBaseline = "top";
        window.ctx.textAlign = "left";
        let texts = splitText(x0, y0, x1, y1, text, this);

        window.ctx.rect(x0, y0, x1 - x0, y1 - y0);
        let dy = 0.0;

        for (let i = 0; i < texts.length; i++) {
            window.ctx.fillText(texts[i], x0, y0 + dy);
            dy += fontsize * lineOffsetScale;
            if (dy >= (y1 - y0)) break;
        }

        window.ctx.restore();
        return texts.length * fontsize * lineOffsetScale;
    }

    CKContext.prototype.drawRectMultilineTextDiagonal = function(x0, y0, x1, y1, text, color, font, fontsize, lineDiagonal, lineOffsetScale) {
        window.ctx.save();

        window.ctx.font = font;
        window.ctx.fillStyle = color;
        window.ctx.textBaseline = "top";
        window.ctx.textAlign = "left";
        let texts = splitText(x0, y0, x1, y1, text, this);

        window.ctx.rect(x0, y0, x1 - x0, y1 - y0);
        let dx = 0.0;
        let dy = 0.0;

        for (let i = 0; i < texts.length; i++) {
            if (texts[i]) {
                window.ctx.fillText(texts[i], x0 + dx, y0 + dy);
                dy += fontsize * lineOffsetScale;
                dx += lineDiagonal;
            } else {
                dx += lineDiagonal * 0.5;
                dy += fontsize * lineOffsetScale * 0.5;
            }
            if (dy >= (y1 - y0)) break;
        }

        window.ctx.restore();
        return texts.length * fontsize * lineOffsetScale;
    }

    CKContext.prototype.drawRectMultilineTextCenter = function(x0, y0, x1, y1, text, color, font, fontsize, lineOffsetScale) {
        window.ctx.save();

        window.ctx.font = font;
        window.ctx.fillStyle = color;
        window.ctx.textBaseline = "top";
        window.ctx.textAlign = "center";
        let texts = splitText(x0, y0, x1, y1, text, this);

        window.ctx.rect(x0, y0, x1 - x0, y1 - y0);
        let dy = 0.0;

        for (let i = 0; i < texts.length; i++) {
            window.ctx.fillText(texts[i], x0 + (x1 - x0) / 2, y0 + dy);
            dy += fontsize * lineOffsetScale;
            if (dy >= (y1 - y0)) break;
        }

        window.ctx.restore();
        return texts.length * fontsize * lineOffsetScale;
    }

    window.drawUIItems = CKContext.prototype.drawUIItems = function(datas) {
            for (let i of datas) {
                if (i == null) continue;

                if (i.type == "text") {
                    window.ctx.save();
                    window.ctx.font = `${i.fontsize}px PhigrosFont`;
                    window.ctx.textBaseline = i.textBaseline;
                    window.ctx.textAlign = i.textAlign;
                    window.ctx.fillStyle = i.color;
                    window.ctx.translate(i.x + i.dx, i.y + i.dy);
                    if (i.sx != 1.0 || i.sy != 1.0) window.ctx.scale(i.sx, i.sy);
                    if (i.rotate != 0.0) window.ctx.rotate(i.rotate * Math.PI / 180);
                    window.ctx.fillText(i.text, 0, 0);
                    window.ctx.restore();
                }
                else if (i.type == "image") {
                    window.ctx.save();
                    const img = eval(i.image);
                    const [r_val, g_val, b_val, a_val] = i.color;
                    
                    window.ctx.translate(i.x + i.dx, i.y + i.dy);
                    if (i.rotate != 0.0) window.ctx.rotate(i.rotate * Math.PI / 180);
                    
                    if (a_val != 1.0) window.ctx.globalAlpha = a_val;
                    
                    if (r_val != 255 || g_val != 255 || b_val != 255) {
                        // 使用新的滤镜函数
                        window.ctx.drawImageWithColorFilter(img, r_val, g_val, b_val, 0, 0, i.width, i.height);
                    } else {
                        // 使用常规的 drawImage
                        window.ctx.drawImage(img, 0, 0, i.width, i.height);
                    }
                    
                    window.ctx.restore();
                }
                else if (i.type == "call") {
                    this[i.name](...i.args);
                }
                else if (i.type == "pbar") {
                    const { w, pw, process } = i;
                    window.ctx.save();
                    const [r, g, b, a] = i.color.split("(")[1].split(")")[0].split(", ");
                    window.ctx.fillRectExConvert2LeftCenter(0, 0, w * process, pw, `rgba(${145 * r / 255}, ${145 * g / 255}, ${145 * b / 255}, ${0.85 * a})`);
                    window.ctx.fillRectExConvert2LeftCenter(w * process - w * 0.00175, 0, w * 0.00175, pw, `rgba(${r}, ${g}, ${b}, ${0.9 * a})`);
                    window.ctx.restore();
                }
            }
        };

    ctx.drawImageWithColorFilter = function(img, r, g, b, dx, dy, dw, dh) {
        const CanvasKit = Canvas2D.getCanvasKit();
        if (!CanvasKit) return;

        let ckImage = null;
        try {
            // 将普通图像转为 CanvasKit 图像
            ckImage = CanvasKit.MakeImageFromCanvasImageSource(img);
        } catch (e) {
            console.error("Failed to create CanvasKit image:", e);
            return;
        }

        if (!ckImage) return;

        // 创建颜色矩阵
        const colorMatrix = [

            0,       g / 255, 0,       0, 0,
            0,       0,       b / 255, 0, 0,
            0,       0,       0,       1, 0, // Alpha 通道保持不变
        ];

        // 创建一个 Paint 对象并应用颜色滤镜
        const paint = new CanvasKit.Paint();
        paint.setAlphaf(window.ctx.globalAlpha); // 遵循全局透明度
        paint.setBlendMode(window.ctx._getBlendMode()); // 遵循全局混合模式
        paint.setColorFilter(CanvasKit.ColorFilter.MakeMatrix(colorMatrix));
        
        // 使用底层 _ckCanvas 进行绘制
        window.ctx._ckCanvas.drawImageRect(
            ckImage,
            CanvasKit.XYWHRect(0, 0, ckImage.width(), ckImage.height()), // 源矩形
            CanvasKit.XYWHRect(dx, dy, dw, dh),                           // 目标矩形
            paint
        );

        // 释放内存
        paint.delete();
        ckImage.delete();

    class ShaderLoader {
        constructor() {
            window.ctx.pgs = new Map();
        }

        load(name, glsl) {
            if (window.ctx.pgs.has(name)) return;
            let pg = createGLProgram(glsl);
            window.ctx.pgs.set(name, pg);
        }

        render(im, name, uniforms) {
            let pg = window.ctx.pgs.get(name);
            if (pg === void 0) return null;
            return drawGL(pg, im, uniforms);
        }

        renderToCanvas(ctx, name, uniforms) {
            const cv = ctx.canvas;
            uniforms["screenSize"] = [cv.width, cv.height];
            let result = window.ctx.render(cv, name, uniforms);
            if (result === null) return;
            ctx.clear();
            ctx.save();
            ctx.translate(cv.width / 2, cv.height / 2);
            ctx.scale(1, -1);
            ctx.drawImage(result, -cv.width / 2, -cv.height / 2);
            ctx.restore();
        }
    }

    function splitText(x0, y0, x1, y1, text, cv) {
        texts = [];

        function _splitTexts(element) {
            let width = cv.measureText(element).width;
            if (width >= (x1 - x0) * 0.95) {
                for (let i = element.length - 1; i >= 0; i--) {
                    let new_element = element.substring(0, i);
                    if (cv.measureText(new_element).width < (x1 - x0) * 0.95) {
                        nextString = element.substring(i);
                        // i think this is not necessary
                        // if (letters.indexOf(new_element[new_element.length - 1]) != -1 && letters.indexOf(nextString[0]) != -1) {
                        //     nextString = new_element[new_element.length - 1] + nextString;
                        //     new_element = new_element.substring(0, new_element.length - 1) + "-";
                        // }
                        texts.push(new_element);
                        _splitTexts(nextString);
                        return;
                    }
                }
                texts.push(element);
            } else {
                texts.push(element);
            }
        }
        text.split("\n").forEach(_splitTexts);
        return texts;
    }

    async function connectToSocketBridge() {
        const addr = '127.0.0.1';
        const port = 8080;
        let socket;
        let connected = false;
        const split_magic = "\x00";
        while (!connected) {
            try {
                socket = new WebSocket(`ws://${addr}:${port}`);
                connected = true;
            } catch (error) {
                console.error('Error connecting to WebSocket:', error);
                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }

        window.pywebview = {
            api: {
                call_attr: (attr, ...args) => {
                    socket.send(JSON.stringify({
                        type: "jsapi_callback",
                        name: attr,
                        args: args
                    }));
                }
            }
        }
        socket.onopen = () => {
            console.log("Connected to server");
        };
        socket.onmessage = async (event) => {
            for (let rawdata of event.data.split(split_magic)) {
                if (!rawdata) continue;
                let data = JSON.parse(rawdata);
                switch (data.type) {
                    case "evaljs": {
                        try {
                            const result = r2eval(data.code);
                            socket.send(JSON.stringify({
                                type: "evaljs_result",
                                result: result,
                                tid: data.tid
                            }) + split_magic);
                        } catch (e) {
                            socket.send(JSON.stringify({
                                type: "jsapi_callback",
                                name: "_socket_bridge_error",
                                args: [data.code, e.msg + "\n" + e.stack]
                            }));
                        }
                    }
                }
            }
        }
    }

    function toLowQualityImage(im) {
        if (im.tagName && im.tagName.toLowerCase() == "video") return im;
        if (im.nobitmap_tag) return im;
        if (lowquality_imweakmap.has(im)) return lowquality_imweakmap.get(im);

        if (
            lowquality_imjscvscale_x != 1.0
            && im.width > lowquality_imjs_maxsize
            && im.height > lowquality_imjs_maxsize
            && !im._lowquality_pcsing
        ) {
            im._lowquality_pcsing = true;
            (async () => {
                let tempcv = document.createElement("canvas");
                tempcv.width = Math.floor(im.width / lowquality_imjscvscale_x);
                tempcv.height = Math.floor(im.height / lowquality_imjscvscale_x);
                if (tempcv.width < 1 || tempcv.height < 1) {
                    tempcv.width = im.width;
                    tempcv.height = im.height;
                }
                tempctx = tempcv.getContext("2d").drawImage(im, 0, 0, tempcv.width, tempcv.height);
                lowquality_imweakmap.set(
                    im,
                    enable_jscanvas_bitmap ? await createImageBitmap(tempcv) : tempcv
                );
                im._lowquality_pcsing = undefined;
            })();
        }
        else if (enable_jscanvas_bitmap && !(im instanceof ImageBitmap) && !im._lowquality_pcsing) {
            im._lowquality_pcsing = true;
            (async () => {
                let tempcv = document.createElement("canvas");
                tempcv.width = im.width;
                tempcv.height = im.height;
                tempctx = tempcv.getContext("2d").drawImage(im, 0, 0, tempcv.width, tempcv.height);
                lowquality_imweakmap.set(im, await createImageBitmap(tempcv));
                im._lowquality_pcsing = undefined;
            })();
        }

        return im;
    }

    

    const proxyTouchEvent = function (from, to) {
        window.addEventListener(from, (e) => {
            let touch = e.changedTouches[0];
            let mouseEvent = new MouseEvent(to, {
                clientX: touch.clientX,
                clientY: touch.clientY,
                buttons: 1
            });
            window.dispatchEvent(mouseEvent);
        });
    }
    
    proxyTouchEvent("touchstart", "mousedown");

    const fixEventPosition = (x, y) => [x * dpr - canvasPosD[0], y * dpr - canvasPosD[1]];
    const proxyNeedPositionEvent = function (from, to, cls) {
        const othernames = ["altKey", "bubbles", "button", "buttons", "cancelBubble", "cancelable", "clientX", "clientY", "composed", "ctrlKey", "currentTarget", "defaultPrevented", "detail", "eventPhase", "fromElement", "layerX", "layerY", "metaKey", "movementX", "movementY", "offsetX", "offsetY", "pageX", "pageY", "relatedTarget", "returnValue", "screenX", "screenY", "shiftKey", "sourceCapabilities", "srcElement", "target", "timeStamp", "toElement", "type", "view", "which", "x", "y"];
        window.addEventListener(from, (e) => {
            const [x, y] = fixEventPosition(e.x, e.y);
            const [clientX, clientY] = fixEventPosition(e.clientX, e.clientY);
            const eventValues = {
                ...(() => {
                    const result = {};
                    for (const name of othernames) result[name] = e[name];
                    return result;
                })(),
                x: x, y: y,
                clientX: clientX, clientY: clientY
            };
            const newEvent = new cls(to, eventValues);
            window.dispatchEvent(newEvent);
        });
    }

    proxyNeedPositionEvent("mousedown", "mousedown-np", MouseEvent);
    proxyNeedPositionEvent("mousemove", "mousemove-np", MouseEvent);
